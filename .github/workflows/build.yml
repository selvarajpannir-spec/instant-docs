name: Build Insta Docs APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        # Google removed the old "tools" package. Only install what we need.
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

    - name: Install Gradle 9.6.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.6.1'

    - name: Create project folders
      run: |
        mkdir -p project/app/src/main/java/com/instadocs/app
        mkdir -p project/app/src/main/res/xml
        mkdir -p project/app/src/main/res/values
        mkdir -p project/app/src/main/res/mipmap-hdpi
        mkdir -p project/app/src/main/assets
        mkdir -p project/app/src/main/res/drawable

    - name: Copy Manifest
      run: cp AndroidManifest.xml project/app/src/main/AndroidManifest.xml

    - name: Copy Kotlin files
      run: |
        cp MainActivity.kt project/app/src/main/java/com/instadocs/app/
        cp AppBridge.kt project/app/src/main/java/com/instadocs/app/

    - name: Copy assets
      run: |
        cp index.html project/app/src/main/assets/ || true

    - name: Copy FileProvider paths
      run: cp file_paths.xml project/app/src/main/res/xml/

    - name: Copy app build.gradle
      run: cp build.gradle project/app/build.gradle

    - name: Copy ProGuard rules
      run: cp proguard-rules.pro project/app/proguard-rules.pro

    - name: Create basic strings.xml
      run: |
        cat > project/app/src/main/res/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">Insta Docs</string>
        </resources>
        EOF

    - name: Create root build.gradle
      run: |
        cat > project/build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:9.0.1'
                classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.2.10'
            }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

    - name: Create settings.gradle
      run: |
        cat > project/settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "InstaDocs"
        include ':app'
        EOF

    - name: Create gradle.properties
      run: |
        cat > project/gradle.properties << 'EOF'
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx2048m
        android.nonTransitiveRClass=true
        EOF

    - name: Create placeholder launcher icon if missing
      run: |
        # Simple 1x1 placeholder so build doesn't fail if no icon.png provided
        if [ ! -f icon.png ]; then
          python3 -c "
        from struct import pack
        import zlib
        def chunk(tag, data):
            return pack('>I', len(data)) + tag + data + pack('>I', zlib.crc32(tag + data) & 0xffffffff)
        raw = b'\x00' + b'\x00\x00\x00' * 1
        png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', pack('>IIBBBBB', 1, 1, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
        open('project/app/src/main/res/mipmap-hdpi/ic_launcher.png', 'wb').write(png)
        "
        else
          cp icon.png project/app/src/main/res/mipmap-hdpi/ic_launcher.png
        fi

    - name: Build Debug APK + Unsigned Release APK
      run: |
        set -o pipefail
        cd project
        gradle assembleDebug assembleRelease 2>&1 | tee build_log.txt

    - name: Write error.md on failure
      if: failure()
      run: |
        {
          echo '# Build Failed'
          echo
          echo '```'
          tail -n 400 project/build_log.txt 2>/dev/null || echo 'No Gradle log captured - failure happened before the build step.'
          echo '```'
        } > error.md

    - name: Upload error log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-log
        path: error.md

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: project/app/build/outputs/apk/debug/*.apk

    - name: Upload Unsigned Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-apk
        path: project/app/build/outputs/apk/release/*.apk
        
